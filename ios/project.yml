name: VPhoneiOS
options:
  bundleIdPrefix: com.nightvibes33
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.9"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGNING_ALLOWED: "NO"
    SUPPORTS_MACCATALYST: "NO"
targets:
  VPhoneiOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Native
      - path: ../sources/VPhoneCore/VPhoneVirtualMachineManifest.swift
      - path: ../sources/VPhoneCore/VPhoneBundle.swift
      - path: ../sources/VPhoneCore/VPhoneRestoreInfo.swift
      - path: ../sources/VPhoneCore/VPhoneBundleReport.swift
      - path: ../sources/VPhoneCore/VPhoneFirmwareCatalog.swift
      - path: ../sources/VPhoneCore/VPhoneBootPatterns.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nightvibes33.vphoneios
        SWIFT_OBJC_BRIDGING_HEADER: Native/VPhoneNativeVM.h
        CLANG_ENABLE_MODULES: "YES"
        ENABLE_BITCODE: "NO"
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: VPhone
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        LSRequiresIPhoneOS: true
        LSSupportsOpeningDocumentsInPlace: true
        UIFileSharingEnabled: true
        UISupportsDocumentBrowser: false
        UIRequiredDeviceCapabilities: [arm64]
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UILaunchScreen: {}
    entitlements:
      path: VPhoneiOS.entitlements
