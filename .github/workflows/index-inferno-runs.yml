name: Index Inferno Runs

on:
  push:
    branches: [main]
    paths:
      - .github/index-inferno-runs-request

permissions:
  actions: read
  contents: write

jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Record latest Inferno runs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p status
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/workflows/inferno-public-jailbroken-iphone.yml/runs?per_page=10" \
            --jq '{total_count, runs: [.workflow_runs[] | {id, run_number, status, conclusion, event, head_sha, created_at, updated_at, html_url}]}' \
            > status/inferno-runs.json

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add status/inferno-runs.json
          git commit -m 'Index latest Inferno runs' || exit 0
          git pull --rebase origin main
          git push origin HEAD:main
