name: vphone-cli iPhone Remote Lab

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Real boot requires a physical Apple-silicon self-hosted runner
        required: true
        default: boot-bare-metal
        type: choice
        options:
          - boot-bare-metal
          - hosted-capability-probe
      vm_name:
        description: Persistent virtual iPhone name
        required: true
        default: github-phone
        type: string
      variant:
        description: Firmware patch variant selected during VM creation
        required: true
        default: jb
        type: choice
        options:
          - less
          - regular
          - dev
          - jb
          - exp
      boot_timeout_seconds:
        description: Time allowed for the launched iPhone to expose VNC
        required: true
        default: '1800'
        type: choice
        options:
          - '900'
          - '1800'
          - '3600'
      keep_alive_minutes:
        description: Keep noVNC and native VNC available after verified boot
        required: true
        default: '120'
        type: choice
        options:
          - '60'
          - '120'
          - '180'

permissions:
  contents: read

concurrency:
  group: vphone-iphone-remote-lab
  cancel-in-progress: false

jobs:
  hosted-capability-probe:
    if: inputs.mode == 'hosted-capability-probe'
    name: Prove GitHub-hosted macOS cannot boot PV=3
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Build vphone-cli
        id: build
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          ./scripts/setup_tools.sh 2>&1 | tee "$RUNNER_TEMP/setup-tools.log"
          setup_rc=${PIPESTATUS[0]}
          if [ "$setup_rc" -ne 0 ]; then
            exit "$setup_rc"
          fi
          ./scripts/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"
          exit ${PIPESTATUS[0]}

      - name: Run bootability preflight
        id: preflight
        continue-on-error: true
        shell: bash
        run: |
          set -uo pipefail
          BIN="$GITHUB_WORKSPACE/.build/vphone-cli.app/Contents/MacOS/vphone-cli"
          test -x "$BIN" || exit 2
          VPHONE_CLI_BIN="$BIN" ./scripts/boot_host_preflight.sh --assert-bootable \
            2>&1 | tee "$RUNNER_TEMP/preflight.log"
          exit ${PIPESTATUS[0]}

      - name: Publish probe result
        if: always()
        shell: bash
        env:
          BUILD_OUTCOME: ${{ steps.build.outcome }}
          PREFLIGHT_OUTCOME: ${{ steps.preflight.outcome }}
        run: |
          {
            echo '## Hosted runner diagnostic only'
            echo
            echo "- Build: **$BUILD_OUTCOME**"
            echo "- Bootability preflight: **$PREFLIGHT_OUTCOME**"
            echo '- No virtual iPhone was created or launched.'
            echo '- GitHub-hosted macOS is already virtualized, so Apple PV=3 cannot be nested there.'
            echo '- Select `boot-bare-metal` on an interactive physical Apple-silicon self-hosted runner for a real boot.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload probe logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vphone-hosted-probe-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/setup-tools.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/preflight.log
          if-no-files-found: warn
          retention-days: 14

  boot-bare-metal:
    if: inputs.mode == 'boot-bare-metal'
    name: Boot and verify virtual iPhone
    runs-on: [self-hosted, macOS, ARM64, vphone]
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Validate physical interactive Mac host
        shell: bash
        env:
          TAILSCALE_AUTHKEY: ${{ secrets.TAILSCALE_AUTHKEY }}
        run: |
          set -euo pipefail

          [ "$(uname -m)" = arm64 ] || {
            echo 'This job requires a physical Apple-silicon Mac.' >&2
            exit 1
          }

          [ "$(sw_vers -productVersion | cut -d. -f1)" -ge 15 ] || {
            echo 'This job requires macOS 15 or newer.' >&2
            exit 1
          }

          [ "$(sysctl -n kern.hv_support 2>/dev/null || echo 0)" = 1 ] || {
            echo 'Virtualization.framework is unavailable on this host.' >&2
            exit 1
          }

          model="$(system_profiler SPHardwareDataType 2>/dev/null | awk -F': ' '/Model Name/ {print $2; exit}')"
          nested="$(sysctl -n kern.hv_vmm_present 2>/dev/null || true)"
          if [ "$nested" = 1 ] || [ "$model" = 'Apple Virtual Machine 1' ]; then
            echo 'Nested Mac VM detected. vphone PV=3 cannot boot here.' >&2
            exit 1
          fi

          console_user="$(stat -f '%Su' /dev/console 2>/dev/null || true)"
          current_user="$(id -un)"
          if [ -z "$console_user" ] || [ "$console_user" = root ] || [ "$console_user" != "$current_user" ]; then
            echo 'Start the runner interactively with ./run.sh from the logged-in Mac desktop account.' >&2
            echo 'Do not install this vphone runner as a background service.' >&2
            exit 1
          fi

          test -n "$TAILSCALE_AUTHKEY" || {
            echo 'Missing repository secret: TAILSCALE_AUTHKEY' >&2
            exit 1
          }

          sudo -n true || {
            echo 'The dedicated runner account needs passwordless sudo for vphone restore/CFW installation.' >&2
            exit 1
          }

          command -v brew >/dev/null
          command -v python3 >/dev/null

          {
            echo "model=$model"
            echo "console_user=$console_user"
            uname -a
            sw_vers
            csrutil status || true
            csrutil allow-research-guests status || true
            sysctl -n kern.bootargs 2>/dev/null || true
          } | tee "$RUNNER_TEMP/physical-host.txt"

      - name: Join private Tailscale network
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          version: latest

      - name: Install remote-view utilities
        shell: bash
        run: |
          set -euo pipefail
          brew list socat >/dev/null 2>&1 || brew install socat

          NOVNC_ROOT="$RUNNER_TEMP/noVNC"
          NOVNC_VENV="$RUNNER_TEMP/novnc-venv"
          rm -rf "$NOVNC_ROOT" "$NOVNC_VENV"
          git clone --depth 1 https://github.com/novnc/noVNC.git "$NOVNC_ROOT"
          python3 -m venv "$NOVNC_VENV"
          "$NOVNC_VENV/bin/python" -m pip install --upgrade pip websockify

          echo "NOVNC_ROOT=$NOVNC_ROOT" >> "$GITHUB_ENV"
          echo "NOVNC_VENV=$NOVNC_VENV" >> "$GITHUB_ENV"

      - name: Build and sign vphone-cli
        shell: bash
        run: |
          set -euo pipefail
          ./scripts/setup_tools.sh 2>&1 | tee "$RUNNER_TEMP/setup-tools.log"
          ./scripts/build.sh 2>&1 | tee "$RUNNER_TEMP/build.log"

          VPHONE_BIN="$GITHUB_WORKSPACE/.build/vphone-cli.app/Contents/MacOS/vphone-cli"
          test -x "$VPHONE_BIN"
          chmod +x "$GITHUB_WORKSPACE/scripts/github_boot_vphone.zsh"
          echo "VPHONE_BIN=$VPHONE_BIN" >> "$GITHUB_ENV"

      - name: Create, launch, and verify iPhone boot
        id: boot
        shell: zsh
        env:
          VM_NAME: ${{ inputs.vm_name }}
          VARIANT: ${{ inputs.variant }}
          VPHONE_BOOT_TIMEOUT_SECONDS: ${{ inputs.boot_timeout_seconds }}
        run: |
          set -euo pipefail
          BOOT_LOG_DIR="$RUNNER_TEMP/vphone-remote-lab"
          mkdir -p "$BOOT_LOG_DIR"

          VPHONE_CLI_BIN="$VPHONE_BIN" \
            "$GITHUB_WORKSPACE/scripts/github_boot_vphone.zsh" \
            "$VM_NAME" "$VARIANT" "$BOOT_LOG_DIR" \
            2>&1 | tee "$RUNNER_TEMP/verified-boot.log"

          GUEST_IP="$(cat "$BOOT_LOG_DIR/guest-ip.txt")"
          test -n "$GUEST_IP"
          nc -z -G 3 "$GUEST_IP" 5901

          echo "guest_ip=$GUEST_IP" >> "$GITHUB_OUTPUT"
          echo "GUEST_IP=$GUEST_IP" >> "$GITHUB_ENV"
          echo "VPHONE_LAUNCH_PID_FILE=$BOOT_LOG_DIR/vphone-launch.pid" >> "$GITHUB_ENV"

      - name: Expose noVNC and native VNC to the real iPhone
        shell: bash
        run: |
          set -euo pipefail

          TS_IP="$(tailscale ip -4 | head -n1)"
          test -n "$TS_IP"
          echo "TS_IP=$TS_IP" >> "$GITHUB_ENV"

          nohup socat TCP-LISTEN:5901,bind="$TS_IP",reuseaddr,fork TCP:"$GUEST_IP":5901 \
            >"$RUNNER_TEMP/socat-vnc.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/socat-vnc.pid"

          if nc -z -G 2 "$GUEST_IP" 22222 >/dev/null 2>&1; then
            nohup socat TCP-LISTEN:22222,bind="$TS_IP",reuseaddr,fork TCP:"$GUEST_IP":22222 \
              >"$RUNNER_TEMP/socat-ssh.log" 2>&1 &
            echo $! > "$RUNNER_TEMP/socat-ssh.pid"
            echo 'SSH_AVAILABLE=1' >> "$GITHUB_ENV"
          else
            echo 'SSH_AVAILABLE=0' >> "$GITHUB_ENV"
          fi

          nohup "$NOVNC_VENV/bin/websockify" --web "$NOVNC_ROOT" \
            "$TS_IP:6080" "$GUEST_IP:5901" \
            >"$RUNNER_TEMP/novnc.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/novnc.pid"

          for attempt in $(seq 1 30); do
            nc -z -G 2 "$TS_IP" 5901 >/dev/null 2>&1 && \
            nc -z -G 2 "$TS_IP" 6080 >/dev/null 2>&1 && break
            sleep 2
          done

          nc -z -G 3 "$TS_IP" 5901
          nc -z -G 3 "$TS_IP" 6080

          NOVNC_URL="http://$TS_IP:6080/vnc.html?autoconnect=true&resize=scale"
          NATIVE_VNC_URL="vnc://$TS_IP:5901"
          echo "NOVNC_URL=$NOVNC_URL" >> "$GITHUB_ENV"
          echo "NATIVE_VNC_URL=$NATIVE_VNC_URL" >> "$GITHUB_ENV"

          {
            echo "noVNC=$NOVNC_URL"
            echo "VNC=$NATIVE_VNC_URL"
            echo "guest_ip=$GUEST_IP"
          } | tee "$RUNNER_TEMP/remote-addresses.txt"

      - name: Publish verified iPhone connections
        shell: bash
        env:
          VM_NAME: ${{ inputs.vm_name }}
          VARIANT: ${{ inputs.variant }}
        run: |
          {
            echo '## ✅ Virtual iPhone boot verified'
            echo
            echo "- VM: \`$VM_NAME\`"
            echo "- Variant: \`$VARIANT\`"
            echo "- Guest VNC port: **reachable**"
            echo "- **noVNC in iPhone Safari:** [$NOVNC_URL]($NOVNC_URL)"
            echo "- **Native iPhone VNC app:** \`$NATIVE_VNC_URL\`"
            if [ "${SSH_AVAILABLE:-0}" = 1 ]; then
              echo "- SSH: \`ssh -p 22222 mobile@$TS_IP\`"
              echo '- Default jailbreak password: `alpine`'
            fi
            echo
            echo 'Turn on Tailscale on the real iPhone before opening either address.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Keep verified iPhone session online
        shell: bash
        env:
          KEEP_ALIVE: ${{ inputs.keep_alive_minutes }}
        run: |
          set -euo pipefail
          end=$((SECONDS + KEEP_ALIVE * 60))

          while [ "$SECONDS" -lt "$end" ]; do
            launch_pid="$(cat "$VPHONE_LAUNCH_PID_FILE")"
            kill -0 "$launch_pid" 2>/dev/null || {
              echo 'The virtual iPhone process exited.' >&2
              tail -n 240 "$RUNNER_TEMP/vphone-remote-lab/vphone-launch.log" || true
              exit 1
            }

            nc -z -G 3 "$GUEST_IP" 5901 || {
              echo 'The virtual iPhone VNC framebuffer stopped responding.' >&2
              exit 1
            }

            kill -0 "$(cat "$RUNNER_TEMP/novnc.pid")" 2>/dev/null
            kill -0 "$(cat "$RUNNER_TEMP/socat-vnc.pid")" 2>/dev/null
            echo "$(date -u +%FT%TZ) verified iPhone online: $NOVNC_URL | $NATIVE_VNC_URL"
            sleep 60
          done

      - name: Upload boot evidence and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vphone-verified-boot-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/physical-host.txt
            ${{ runner.temp }}/setup-tools.log
            ${{ runner.temp }}/build.log
            ${{ runner.temp }}/verified-boot.log
            ${{ runner.temp }}/remote-addresses.txt
            ${{ runner.temp }}/vphone-remote-lab/preflight.log
            ${{ runner.temp }}/vphone-remote-lab/vm-create.log
            ${{ runner.temp }}/vphone-remote-lab/vm-info.json
            ${{ runner.temp }}/vphone-remote-lab/vphone-launch.log
            ${{ runner.temp }}/vphone-remote-lab/guest-ip.txt
            ${{ runner.temp }}/novnc.log
            ${{ runner.temp }}/socat-vnc.log
            ${{ runner.temp }}/socat-ssh.log
          if-no-files-found: warn
          retention-days: 14

      - name: Stop remote session
        if: always()
        shell: bash
        env:
          VM_NAME: ${{ inputs.vm_name }}
        run: |
          set +e
          [ -f "$RUNNER_TEMP/novnc.pid" ] && kill "$(cat "$RUNNER_TEMP/novnc.pid")" 2>/dev/null
          [ -f "$RUNNER_TEMP/socat-vnc.pid" ] && kill "$(cat "$RUNNER_TEMP/socat-vnc.pid")" 2>/dev/null
          [ -f "$RUNNER_TEMP/socat-ssh.pid" ] && kill "$(cat "$RUNNER_TEMP/socat-ssh.pid")" 2>/dev/null
          [ -n "${VPHONE_BIN:-}" ] && "$VPHONE_BIN" vm stop "$VM_NAME" --timeout 20
