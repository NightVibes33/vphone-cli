name: Cancel Obsolete Inferno Run

on:
  push:
    branches: [main]
    paths:
      - .github/cancel-obsolete-inferno-request

permissions:
  actions: write
  contents: read

jobs:
  cancel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cancel requested obsolete run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          OBSOLETE_RUN_ID="$(awk -F= '$1 == "obsolete_run_id" {print $2; exit}' \
            .github/cancel-obsolete-inferno-request)"
          [[ "$OBSOLETE_RUN_ID" =~ ^[0-9]+$ ]] || {
            echo 'Invalid or missing obsolete_run_id.' >&2
            exit 1
          }

          response="$(gh api --method POST \
            -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/runs/$OBSOLETE_RUN_ID/cancel" \
            2>&1 || true)"
          printf '%s\n' "$response"
          echo "Cancellation requested for run $OBSOLETE_RUN_ID."
