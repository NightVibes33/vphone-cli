name: Public Jailbroken iPhone (Inferno)

on:
  workflow_dispatch:
    inputs:
      keep_alive_minutes:
        description: Keep noVNC and native VNC tunnels online after verified boot
        required: true
        default: '60'
        type: choice
        options:
          - '30'
          - '60'
  push:
    branches: [main]
    paths:
      - .github/inferno-public-boot-request

permissions:
  contents: write

concurrency:
  group: inferno-public-jailbroken-iphone
  cancel-in-progress: true

jobs:
  boot:
    name: Restore, jailbreak, and verify emulated iPhone
    runs-on: macos-26
    timeout-minutes: 355

    steps:
      - name: Check out public repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Report workflow start
        shell: bash
        run: |
          chmod +x scripts/inferno/report-status.sh
          scripts/inferno/report-status.sh running checkout-ready \
            'GitHub macOS runner started and checked out the public repository.'

      - name: Select run defaults
        shell: bash
        env:
          INPUT_KEEP_ALIVE: ${{ inputs.keep_alive_minutes }}
        run: |
          set -euo pipefail
          echo "KEEP_ALIVE_MINUTES=${INPUT_KEEP_ALIVE:-60}" >> "$GITHUB_ENV"
          echo "INFERNO_WORK_DIR=$RUNNER_TEMP/inferno-public-iphone" >> "$GITHUB_ENV"

      - name: Reclaim runner disk without removing the active compiler
        shell: bash
        run: |
          set -euo pipefail
          echo 'Before cleanup:'
          df -h /

          sudo rm -rf /Library/Developer/CoreSimulator/Profiles/Runtimes/* 2>/dev/null || true
          sudo rm -rf "$HOME/Library/Developer/CoreSimulator/Caches" 2>/dev/null || true
          sudo rm -rf /Applications/Google\ Chrome.app 2>/dev/null || true
          sudo rm -rf /Applications/Firefox.app 2>/dev/null || true
          brew cleanup --prune=all >/dev/null 2>&1 || true

          echo 'After cleanup:'
          df -h /
          xcrun --sdk macosx --show-sdk-path
          clang --version

      - name: Install public build and remote-view dependencies
        shell: bash
        env:
          HOMEBREW_NO_AUTO_UPDATE: '1'
        run: |
          set -euo pipefail
          brew install \
            libtool meson ninja pkgconf dtc glib gnutls jpeg-turbo libpng \
            libslirp libssh libusb lzo ncurses nettle pixman snappy vde zstd \
            lzfse cdrtools jq sshpass cloudflared python@3.13 openssl@3 qemu

          PYTHON_BIN="$(brew --prefix python@3.13)/bin/python3.13"
          "$PYTHON_BIN" -m venv "$RUNNER_TEMP/inferno-python"
          "$RUNNER_TEMP/inferno-python/bin/python" -m pip install --upgrade pip
          "$RUNNER_TEMP/inferno-python/bin/python" -m pip install pyasn1 websockify

          echo "$RUNNER_TEMP/inferno-python/bin" >> "$GITHUB_PATH"
          echo "INFERNO_PYTHON=$RUNNER_TEMP/inferno-python/bin/python" >> "$GITHUB_ENV"

      - name: Report dependencies ready
        shell: bash
        run: |
          scripts/inferno/report-status.sh running dependencies-ready \
            'Homebrew dependencies and the private Python environment are installed.'

      - name: Validate scripts before firmware work
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/inferno/public-github-boot.sh
          bash -n scripts/inferno/run-public-ci.sh
          bash -n scripts/inferno/companion-restore.sh
          bash -n scripts/inferno/install-jailbreak.sh
          bash -n scripts/inferno/report-status.sh

      - name: Report boot pipeline start
        shell: bash
        run: |
          scripts/inferno/report-status.sh running boot-pipeline \
            'Building Inferno, downloading the Apple IPSW, restoring iOS, and installing the jailbreak bootstrap.'

      - name: Download, restore, jailbreak, and verify iOS
        id: boot
        shell: bash
        env:
          INFERNO_RESTORE_TIMEOUT_SECONDS: '10800'
          INFERNO_INSTALL_TIMEOUT_SECONDS: '1200'
          INFERNO_BOOT_TIMEOUT_SECONDS: '2400'
        run: |
          set -uo pipefail
          chmod +x scripts/inferno/*.sh

          scripts/inferno/run-public-ci.sh \
            2>&1 | tee "$RUNNER_TEMP/inferno-public-run.log"
          BOOT_RC=${PIPESTATUS[0]}

          if [ "$BOOT_RC" -ne 0 ]; then
            scripts/inferno/report-status.sh failed boot-pipeline \
              "Inferno boot pipeline exited with code $BOOT_RC." \
              "$RUNNER_TEMP/inferno-public-run.log"
            exit "$BOOT_RC"
          fi

          set -e
          test -f "$INFERNO_WORK_DIR/result.env"
          set -a
          source "$INFERNO_WORK_DIR/result.env"
          set +a

          test "${BOOTED:-0}" = 1
          test "${SPRINGBOARD:-0}" = 1
          test "${AMFI_RESEARCH_MODE:-0}" = 1
          test "${ROOT_SSH:-0}" = 1
          test "${JAILBREAK_MARKER:-0}" = 1

          {
            echo "vnc_password=$VNC_PASSWORD"
            echo "ios_pid=$IOS_PID"
            echo "companion_pid=$COMPANION_PID"
          } >> "$GITHUB_OUTPUT"

          echo "VNC_PASSWORD=$VNC_PASSWORD" >> "$GITHUB_ENV"
          echo "IOS_PID=$IOS_PID" >> "$GITHUB_ENV"
          echo "COMPANION_PID=$COMPANION_PID" >> "$GITHUB_ENV"

      - name: Report jailbroken boot verified
        shell: bash
        run: |
          scripts/inferno/report-status.sh running jailbreak-verified \
            'SpringBoard, AMFI research mode, UID 0 SSH, and the jailbreak marker were verified.'

      - name: Start noVNC browser viewer
        shell: bash
        run: |
          set -euo pipefail
          NOVNC_ROOT="$RUNNER_TEMP/noVNC"
          git clone --depth 1 https://github.com/novnc/noVNC.git "$NOVNC_ROOT"

          nohup websockify --web "$NOVNC_ROOT" 127.0.0.1:6080 127.0.0.1:5901 \
            > "$RUNNER_TEMP/novnc.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/novnc.pid"

          for attempt in $(seq 1 30); do
            nc -z 127.0.0.1 6080 && break
            sleep 2
          done
          nc -z 127.0.0.1 6080

      - name: Publish free noVNC and native VNC tunnels
        shell: bash
        run: |
          set -euo pipefail

          nohup cloudflared tunnel --no-autoupdate --url http://127.0.0.1:6080 \
            > "$RUNNER_TEMP/cloudflared.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/cloudflared.pid"

          ssh-keygen -q -t ed25519 -N '' -f "$RUNNER_TEMP/pinggy-key"
          nohup ssh \
            -i "$RUNNER_TEMP/pinggy-key" \
            -p 443 \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=3 \
            -o ExitOnForwardFailure=yes \
            -R0:127.0.0.1:5901 \
            tcp@free.pinggy.io \
            > "$RUNNER_TEMP/pinggy.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/pinggy.pid"

          NOVNC_BASE=''
          for attempt in $(seq 1 90); do
            NOVNC_BASE="$(grep -Eo 'https://[-a-z0-9]+\.trycloudflare\.com' "$RUNNER_TEMP/cloudflared.log" | tail -n1 || true)"
            [ -n "$NOVNC_BASE" ] && break
            kill -0 "$(cat "$RUNNER_TEMP/cloudflared.pid")" 2>/dev/null || break
            sleep 2
          done
          test -n "$NOVNC_BASE"

          VNC_TCP_URL=''
          for attempt in $(seq 1 90); do
            VNC_TCP_URL="$(grep -Eo 'tcp://[-a-zA-Z0-9.]+:[0-9]+' "$RUNNER_TEMP/pinggy.log" | tail -n1 || true)"
            [ -n "$VNC_TCP_URL" ] && break
            kill -0 "$(cat "$RUNNER_TEMP/pinggy.pid")" 2>/dev/null || break
            sleep 2
          done

          NOVNC_URL="$NOVNC_BASE/vnc.html?autoconnect=true&resize=scale"
          echo "NOVNC_URL=$NOVNC_URL" >> "$GITHUB_ENV"
          echo "VNC_TCP_URL=$VNC_TCP_URL" >> "$GITHUB_ENV"

          {
            echo "noVNC=$NOVNC_URL"
            echo "nativeVNC=$VNC_TCP_URL"
            echo "password=$VNC_PASSWORD"
          } | tee "$RUNNER_TEMP/connection-details.txt"

      - name: Publish verified connection details
        shell: bash
        run: |
          {
            echo '## ✅ Jailbroken emulated iPhone verified'
            echo
            echo '- Hardware target: `iPhone 11 / T8030`'
            echo '- Firmware: `iOS 14.0 beta 5 (18A5351d)` downloaded directly from Apple'
            echo '- SpringBoard/backboardd: **verified**'
            echo '- AMFI research mode: **verified**'
            echo '- Root SSH (`uid=0`): **verified**'
            echo '- Jailbreak marker: **verified**'
            echo
            echo '### Safari / noVNC'
            echo "[$NOVNC_URL]($NOVNC_URL)"
            echo
            echo '### Native VNC'
            if [ -n "${VNC_TCP_URL:-}" ]; then
              echo "\`$VNC_TCP_URL\`"
            else
              echo 'The optional native TCP tunnel did not receive an address; use noVNC.'
            fi
            echo
            echo '### One-time VNC password'
            echo "\`$VNC_PASSWORD\`"
            echo
            echo '- The free tunnel addresses are temporary.'
            echo '- The GitHub job stops the VM when the selected access window ends.'
          } >> "$GITHUB_STEP_SUMMARY"

          scripts/inferno/report-status.sh success remote-access-ready \
            "Verified jailbroken iPhone is online at $NOVNC_URL; native VNC: ${VNC_TCP_URL:-unavailable}."

      - name: Keep the verified iPhone online
        shell: bash
        run: |
          set -euo pipefail
          end=$((SECONDS + KEEP_ALIVE_MINUTES * 60))
          while [ "$SECONDS" -lt "$end" ]; do
            kill -0 "$IOS_PID"
            kill -0 "$COMPANION_PID"
            kill -0 "$(cat "$RUNNER_TEMP/novnc.pid")"
            kill -0 "$(cat "$RUNNER_TEMP/cloudflared.pid")"
            nc -z 127.0.0.1 5901
            nc -z 127.0.0.1 6080
            echo "$(date -u +%FT%TZ) jailbroken iPhone online: $NOVNC_URL ${VNC_TCP_URL:-}"
            sleep 60
          done

      - name: Upload non-firmware boot evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: inferno-public-boot-evidence-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/inferno-public-run.log
            ${{ runner.temp }}/connection-details.txt
            ${{ runner.temp }}/novnc.log
            ${{ runner.temp }}/cloudflared.log
            ${{ runner.temp }}/pinggy.log
            ${{ runner.temp }}/inferno-public-iphone/logs/*.log
            ${{ runner.temp }}/inferno-public-iphone/logs/root-ssh-proof.txt
            ${{ runner.temp }}/inferno-public-iphone/share/companion-restore.log
            ${{ runner.temp }}/inferno-public-iphone/share/idevicerestore.log
            ${{ runner.temp }}/inferno-public-iphone/share/irecovery.txt
            ${{ runner.temp }}/inferno-public-iphone/share/ideviceinfo.txt
            ${{ runner.temp }}/inferno-public-iphone/result.env
          if-no-files-found: warn
          retention-days: 14

      - name: Report unhandled workflow failure
        if: failure()
        shell: bash
        run: |
          chmod +x scripts/inferno/report-status.sh 2>/dev/null || true
          scripts/inferno/report-status.sh failed workflow \
            'The workflow failed outside the main boot command.' \
            "$RUNNER_TEMP/inferno-public-run.log"

      - name: Stop emulators and tunnels
        if: always()
        shell: bash
        run: |
          set +e
          for file in \
            "$RUNNER_TEMP/cloudflared.pid" \
            "$RUNNER_TEMP/pinggy.pid" \
            "$RUNNER_TEMP/novnc.pid" \
            "$INFERNO_WORK_DIR/ios.pid" \
            "$INFERNO_WORK_DIR/companion.pid"; do
            [ -f "$file" ] && kill "$(cat "$file")" 2>/dev/null
          done
          rm -f /tmp/usbqemu
